<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHub - Movie Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 MovieHub</h1>
    <p>Simple JavaScript Movie Ticket Booking</p>
  </header>

  <main>
    <section class="hero">
      <h2>Book Your Movie Ticket</h2>
      <p>Select a movie and start your booking.</p>
      <button onclick="openBooking()">🎟️ Book Now</button>
    </section>

    <section class="movies">
      <div class="movie-card">
        <div class="poster">🦸</div>
        <h3>Super Hero</h3>
        <p>Today • 7:00 PM</p>
      </div>
      <div class="movie-card">
        <div class="poster">🚀</div>
        <h3>Space Adventure</h3>
        <p>Today • 8:30 PM</p>
      </div>
      <div class="movie-card">
        <div class="poster">🐼</div>
        <h3>Funny Panda</h3>
        <p>Today • 6:00 PM</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
